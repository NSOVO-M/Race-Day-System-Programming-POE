name: RaceDay CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore "RaceDay/RaceDay.sln"

      - name: Build solution
        run: dotnet build "RaceDay/RaceDay.sln" --configuration Release --no-restore

      - name: Run tests
        run: dotnet test "RaceDay/RaceDay.Tests/RaceDay.Tests.csproj" --configuration Release --no-build --verbosity normal
